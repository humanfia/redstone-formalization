name = "Redstone"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Redstone", "difftest"]
testDriver = "difftest"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "Redstone"
# `Redstone.lean` imports the model. The proofs are not imported there: every file under these
# directories is built by the default target as it is, so a new file needs no entry anywhere,
# and the test runner does not wait for proofs.
globs = ["Redstone", "Redstone.Proof.+", "Redstone.Lemmas.+", "Redstone.Theorems.+", "Redstone.Contraption.+"]

[[lean_exe]]
name = "difftest"
root = "Difftest"
